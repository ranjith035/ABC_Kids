<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#eef2ff">
<title>ABC Adventure</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🔤</text></svg>">
<style>
  :root{
    --ink:#1b2140;
    --ink-soft:#4b5478;
    --card:#ffffff;
    --shadow:0 8px 0 rgba(27,33,64,.10), 0 18px 40px rgba(27,33,64,.10);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;overflow:hidden}
  body{
    font-family:"Segoe UI",system-ui,-apple-system,"Trebuchet MS",sans-serif;
    color:var(--ink);
    background:#eef2ff;
    user-select:none;
    -webkit-user-select:none;
    touch-action:manipulation;
  }
  button{font-family:inherit;color:inherit;border:0;background:none;cursor:pointer}
  #fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:80}

  /* ---------- screens ---------- */
  .screen{position:absolute;inset:0;display:none;flex-direction:column;padding:clamp(12px,2.6vmin,42px)}
  .screen.active{display:flex;animation:fade .22s ease both}
  @keyframes fade{from{opacity:0;transform:scale(.99)}to{opacity:1;transform:none}}

  /* ---------- home ---------- */
  #home{
    background:
      radial-gradient(60vmax 60vmax at 8% -10%, #ffe9a8 0%, transparent 60%),
      radial-gradient(60vmax 60vmax at 100% 0%, #c9f7e4 0%, transparent 55%),
      radial-gradient(70vmax 70vmax at 50% 120%, #d9dcff 0%, transparent 60%),
      #fbfbff;
    gap:clamp(8px,1.6vmin,18px);
  }
  .topbar{display:flex;align-items:center;justify-content:space-between;gap:12px}
  .brand{font-weight:900;font-size:clamp(18px,2.6vmin,32px);letter-spacing:-.01em;display:flex;align-items:center;gap:.4em}
  .brand .dot{width:.7em;height:.7em;border-radius:50%;background:linear-gradient(135deg,#ff8fab,#ffb703);display:inline-block}
  .top-actions{display:flex;align-items:center;gap:clamp(6px,1vmin,12px)}
  .stars-pill{
    display:flex;align-items:center;gap:.35em;background:#fff;border-radius:999px;
    padding:clamp(6px,1vmin,12px) clamp(12px,1.8vmin,22px);
    font-weight:900;font-size:clamp(16px,2.2vmin,28px);
    box-shadow:0 4px 0 rgba(27,33,64,.08);
  }
  .icon-btn{
    width:clamp(40px,5.4vmin,64px);height:clamp(40px,5.4vmin,64px);border-radius:50%;
    background:#fff;display:grid;place-items:center;font-size:clamp(18px,2.6vmin,30px);
    box-shadow:0 4px 0 rgba(27,33,64,.08);transition:transform .1s;
  }
  .icon-btn:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(27,33,64,.08)}

  .hero{text-align:center;margin-top:clamp(2px,1vmin,10px)}
  .hero h1{
    margin:0;font-size:clamp(28px,5.4vmin,72px);font-weight:900;letter-spacing:-.02em;
    background:linear-gradient(100deg,#ff5d8f,#ff9f1c 35%,#2ec4b6 70%,#4d7cff);
    -webkit-background-clip:text;background-clip:text;color:transparent;
    line-height:1.02;
  }
  .hero p{margin:.25em 0 0;color:var(--ink-soft);font-weight:700;font-size:clamp(12px,1.8vmin,22px)}

  .modes{display:grid;grid-template-columns:repeat(3,1fr);gap:clamp(8px,1.4vmin,16px);max-width:1200px;width:100%;margin:0 auto}
  .mode{
    display:flex;align-items:center;gap:clamp(8px,1.4vmin,16px);text-align:left;
    padding:clamp(10px,1.6vmin,20px) clamp(12px,2vmin,26px);
    border-radius:clamp(14px,2vmin,26px);
    background:var(--card);
    box-shadow:0 6px 0 rgba(27,33,64,.09),0 12px 24px rgba(27,33,64,.07);
    transition:transform .1s ease, box-shadow .1s ease;
  }
  .mode:active{transform:translateY(5px);box-shadow:0 1px 0 rgba(27,33,64,.09)}
  .mode .m-emoji{font-size:clamp(26px,4.4vmin,56px);line-height:1}
  .mode .m-txt{display:flex;flex-direction:column;min-width:0}
  .mode .m-txt b{font-size:clamp(14px,2.2vmin,28px);font-weight:900;line-height:1.1}
  .mode .m-txt small{font-size:clamp(10px,1.35vmin,16px);color:var(--ink-soft);font-weight:600;margin-top:.25em}
  .mode--quiz{background:linear-gradient(160deg,#fff,#e8f0ff)}
  .mode--hunt{background:linear-gradient(160deg,#fff,#e6fbf3)}
  .mode--random{background:linear-gradient(160deg,#fff,#fff2e0)}

  .grid-wrap{flex:1;display:flex;flex-direction:column;justify-content:center;min-height:0;gap:clamp(6px,1vmin,12px);padding-top:clamp(2px,1vmin,10px)}
  .grid-label{text-align:center;font-weight:800;color:var(--ink-soft);font-size:clamp(11px,1.5vmin,18px);letter-spacing:.02em}
  .letter-grid{
    display:grid;
    grid-template-columns:repeat(13,minmax(0,1fr));
    gap:clamp(6px,1.2vmin,14px);
    width:100%;max-width:1700px;margin:0 auto;
    overflow:auto;padding:2px;
  }
  @media (max-width:1150px){ .letter-grid{grid-template-columns:repeat(9,minmax(0,1fr))} }
  @media (max-width:620px){ .letter-grid{grid-template-columns:repeat(6,minmax(0,1fr))} }
  .tile{
    position:relative;aspect-ratio:1/1;border-radius:22%;
    display:grid;place-items:center;
    font-size:clamp(24px,7.2vmin,118px);font-weight:900;line-height:1;
    color:hsl(var(--h) 72% 26%);
    background:linear-gradient(160deg,hsl(var(--h) 95% 91%),hsl(var(--h) 85% 73%));
    box-shadow:0 6px 0 hsl(var(--h) 60% 64%), 0 10px 20px rgba(27,33,64,.08);
    transition:transform .1s ease, box-shadow .1s ease;
  }
  .tile:active{transform:translateY(5px);box-shadow:0 1px 0 hsl(var(--h) 60% 72%)}
  .tile .badge{
    position:absolute;right:5%;bottom:3%;
    font-size:clamp(9px,1.3vmin,15px);font-weight:900;color:#7a5a00;
    display:flex;align-items:center;gap:.15em;
  }
  .tile .badge .s{font-size:1.15em}

  .tip{text-align:center;color:#8b93b5;font-size:clamp(10px,1.3vmin,15px);font-weight:600}
  @media (max-width:720px){ .mode .m-txt small{display:none} .tip{display:none} }

  /* ---------- learn ---------- */
  #learn{
    background:linear-gradient(160deg,hsl(var(--h,200) 92% 97%),hsl(var(--h,200) 84% 88%));
    gap:clamp(4px,1vmin,12px);
  }
  .learn-top{display:flex;align-items:center;justify-content:space-between;gap:10px}
  .back-btn{
    width:clamp(44px,6vmin,72px);height:clamp(44px,6vmin,72px);border-radius:50%;
    background:#fff;display:grid;place-items:center;font-size:clamp(20px,3vmin,34px);font-weight:900;
    box-shadow:0 4px 0 rgba(27,33,64,.1);transition:transform .1s;color:var(--ink);
  }
  .back-btn:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(27,33,64,.1)}
  .learn-title{font-weight:900;font-size:clamp(14px,2vmin,26px);color:hsl(var(--h,200) 55% 30%);opacity:.85}

  .auto-btn{
    display:flex;align-items:center;gap:clamp(5px,1vmin,8px);
    height:clamp(40px,5.4vmin,58px);
    padding:0 clamp(10px,1.6vmin,18px);
    border-radius:999px;
    background:#fff;
    font-weight:900;
    font-size:clamp(12px,1.6vmin,17px);
    color:hsl(var(--h,200) 60% 30%);
    box-shadow:0 4px 0 rgba(27,33,64,.09), 0 8px 16px rgba(27,33,64,.05);
    transition:transform .1s, background .15s, color .15s, box-shadow .15s;
    user-select:none;
    white-space:nowrap;
  }
  .auto-btn:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(27,33,64,.09)}
  .auto-btn.on{
    background:linear-gradient(135deg, hsl(var(--h,200) 82% 46%), hsl(var(--h,200) 90% 38%));
    color:#fff;
    box-shadow:0 4px 0 hsl(var(--h,200) 80% 26%), 0 8px 18px hsla(var(--h,200),80%,40%,.25);
  }
  .auto-dot{
    width:clamp(8px,1vmin,10px);height:clamp(8px,1vmin,10px);border-radius:50%;
    background:#94a3b8;display:inline-block;transition:background .2s;
  }
  .auto-btn.on .auto-dot{
    background:#22c55e;
    box-shadow:0 0 6px #22c55e;
    animation:pulseDot 1.4s infinite ease-in-out;
  }
  @keyframes pulseDot{
    0%,100%{transform:scale(1);opacity:1}
    50%{transform:scale(1.35);opacity:.75}
  }

  .timer-bar-wrap{
    width:100%;max-width:800px;margin:0 auto;
    height:clamp(5px,.8vmin,8px);
    background:rgba(27,33,64,.08);
    border-radius:999px;
    overflow:hidden;
    opacity:0;
    transition:opacity .2s ease;
  }
  .timer-bar-wrap.show{opacity:1}
  .timer-bar{
    height:100%;width:0%;
    background:linear-gradient(90deg, #ff8fab, #ffb703 50%, #2ec4b6);
    border-radius:999px;
    transform-origin:left;
  }
  .timer-bar.running{
    animation:timerCountdown 5s linear forwards;
  }
  @keyframes timerCountdown{
    from{width:0%}
    to{width:100%}
  }
  .learn-stage{
    flex:1;display:flex;align-items:center;justify-content:center;
    gap:clamp(14px,5vmin,80px);flex-wrap:wrap;min-height:0;
  }
  .big-letter{
    font-size:clamp(110px,32vmin,400px);font-weight:900;line-height:.82;
    color:hsl(var(--h,200) 68% 38%);
    text-shadow:0 10px 0 hsl(var(--h,200) 75% 82%);
    letter-spacing:-.03em;
    animation:popIn .35s cubic-bezier(.2,1.4,.4,1) both;
  }
  .word-side{display:flex;flex-direction:column;align-items:center;gap:clamp(2px,1vmin,14px);animation:popIn .4s .05s cubic-bezier(.2,1.4,.4,1) both}
  .word-emoji{font-size:clamp(80px,23vmin,300px);line-height:1;filter:drop-shadow(0 12px 18px rgba(27,33,64,.18))}
  .word-text{
    font-size:clamp(30px,6.6vmin,96px);font-weight:900;letter-spacing:-.01em;
    color:hsl(var(--h,200) 60% 26%);
    text-transform:capitalize;
  }
  @keyframes popIn{from{opacity:0;transform:scale(.86)}to{opacity:1;transform:none}}
  .word-text .hl{color:hsl(var(--h,200) 78% 44%)}
  .word-note{
    text-align:center;font-size:clamp(11px,1.5vmin,18px);font-weight:800;
    color:hsl(var(--h,200) 45% 42%);min-height:1.2em;letter-spacing:.01em;
  }
  .word-rail{
    width:100%;overflow-x:auto;overflow-y:hidden;scrollbar-width:none;-ms-overflow-style:none;
    padding:2px 0;
    -webkit-mask-image:linear-gradient(90deg,transparent,#000 14px,#000 calc(100% - 14px),transparent);
    mask-image:linear-gradient(90deg,transparent,#000 14px,#000 calc(100% - 14px),transparent);
  }
  .word-rail::-webkit-scrollbar{display:none}
  .rail-inner{display:flex;gap:clamp(5px,.9vmin,11px);margin:0 auto;width:max-content;padding:3px 16px}
  .rail-btn{
    flex:0 0 auto;width:clamp(44px,6.2vmin,74px);height:clamp(44px,6.2vmin,74px);
    border-radius:30%;background:rgba(255,255,255,.55);opacity:.7;
    display:grid;place-items:center;font-size:clamp(22px,3.5vmin,44px);
    box-shadow:0 3px 0 rgba(27,33,64,.08);
    transition:transform .12s ease, background .12s ease, opacity .12s ease;
  }
  .rail-btn.on{
    background:#fff;opacity:1;transform:translateY(-3px) scale(1.1);
    box-shadow:0 5px 0 hsl(var(--h,200) 60% 72%);
  }
  .rail-btn:active{transform:scale(.94)}
  .learn-controls{display:flex;align-items:center;justify-content:center;gap:clamp(10px,2vmin,24px);padding-bottom:clamp(4px,2vmin,24px)}
  .nav-btn{
    width:clamp(56px,8vmin,96px);height:clamp(56px,8vmin,96px);border-radius:50%;
    background:#fff;font-size:clamp(22px,3.4vmin,40px);font-weight:900;
    display:grid;place-items:center;color:hsl(var(--h,200) 55% 35%);
    box-shadow:0 6px 0 rgba(27,33,64,.12);transition:transform .1s;
  }
  .nav-btn:active{transform:translateY(4px);box-shadow:0 2px 0 rgba(27,33,64,.12)}
  .say-btn{
    height:clamp(56px,8vmin,96px);padding:0 clamp(20px,3.4vmin,46px);border-radius:999px;
    background:hsl(var(--h,200) 70% 45%);color:#fff;font-weight:900;font-size:clamp(16px,2.4vmin,30px);
    display:flex;align-items:center;gap:.5em;
    box-shadow:0 6px 0 hsl(var(--h,200) 70% 32%);transition:transform .1s;
  }
  .say-btn:active{transform:translateY(4px);box-shadow:0 2px 0 hsl(var(--h,200) 70% 32%)}

  /* ---------- quiz / hunt ---------- */
  .play-screen{background:linear-gradient(160deg,hsl(var(--h,200) 92% 97%),hsl(var(--h,200) 82% 90%));gap:clamp(4px,1vmin,12px)}
  .play-top{display:flex;align-items:center;justify-content:space-between;gap:10px}
  .prompt{
    font-weight:900;font-size:clamp(14px,2.3vmin,30px);color:hsl(var(--h,200) 55% 30%);
    text-align:center;flex:1;line-height:1.15;
  }
  .prompt b{font-size:1.25em;color:hsl(var(--h,200) 65% 38%)}
  .play-body{flex:1;display:flex;align-items:center;justify-content:center;gap:clamp(12px,4vmin,64px);flex-wrap:wrap;min-height:0}
  .quiz-letter{
    font-size:clamp(100px,24vmin,300px);font-weight:900;line-height:.82;letter-spacing:-.03em;
    color:hsl(var(--h,200) 68% 38%);text-shadow:0 10px 0 hsl(var(--h,200) 75% 82%);
    animation:popIn .3s cubic-bezier(.2,1.4,.4,1) both;
  }
  .options{
    display:grid;grid-template-columns:repeat(3,1fr);gap:clamp(8px,1.8vmin,24px);
    width:100%;max-width:min(1000px,62vw);
  }
  .opt{
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.35em;
    background:#fff;border-radius:clamp(14px,2.2vmin,28px);
    padding:clamp(8px,1.6vmin,22px) clamp(6px,1vmin,16px);
    box-shadow:0 8px 0 rgba(27,33,64,.10),0 14px 28px rgba(27,33,64,.08);
    transition:transform .1s ease, box-shadow .1s ease, outline-color .1s;
    outline:6px solid transparent;
  }
  .opt .emoji{font-size:clamp(44px,11vmin,150px);line-height:1;filter:drop-shadow(0 8px 12px rgba(27,33,64,.12))}
  .opt .label{font-size:clamp(12px,2vmin,26px);font-weight:800;color:var(--ink-soft);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
  .opt:active{transform:translateY(6px) scale(.99);box-shadow:0 2px 0 rgba(27,33,64,.10)}
  .opt.correct{outline-color:#22c55e;animation:popBounce .45s cubic-bezier(.2,1.6,.4,1)}
  .opt.wrong{outline-color:#f87171;animation:shake .4s}
  .opt.hint{animation:hintPulse 1.1s ease-in-out infinite}
  .opt.dim{opacity:.45}
  @keyframes popBounce{0%{transform:scale(1)}45%{transform:scale(1.09)}100%{transform:scale(1)}}
  @keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-10px)}40%{transform:translateX(9px)}60%{transform:translateX(-6px)}80%{transform:translateX(4px)}}
  @keyframes hintPulse{0%,100%{outline-color:rgba(250,204,21,.0)}50%{outline-color:rgba(250,204,21,.95)}}

  .hunt-word{display:flex;flex-direction:column;align-items:center;gap:clamp(2px,.8vmin,10px);animation:popIn .35s cubic-bezier(.2,1.4,.4,1) both}
  .hunt-word .emoji{font-size:clamp(76px,22vmin,280px);line-height:1;filter:drop-shadow(0 12px 18px rgba(27,33,64,.18))}
  .hunt-word .label{font-size:clamp(26px,5.4vmin,80px);font-weight:900;color:hsl(var(--h,200) 60% 26%)}
  .letter-opts{display:flex;gap:clamp(10px,2.4vmin,32px);justify-content:center;flex-wrap:wrap}
  .letter-opt{
    width:clamp(76px,15vmin,180px);aspect-ratio:1/1;border-radius:24%;
    display:grid;place-items:center;
    font-size:clamp(40px,9vmin,110px);font-weight:900;line-height:1;
    background:#fff;color:#2b3355;
    box-shadow:0 8px 0 rgba(27,33,64,.10),0 14px 28px rgba(27,33,64,.08);
    outline:6px solid transparent;
    transition:transform .1s, box-shadow .1s;
  }
  .letter-opt:active{transform:translateY(6px);box-shadow:0 2px 0 rgba(27,33,64,.10)}
  .letter-opt.correct{outline-color:#22c55e;animation:popBounce .45s cubic-bezier(.2,1.6,.4,1)}
  .letter-opt.wrong{outline-color:#f87171;animation:shake .4s}
  .letter-opt.hint{animation:hintPulse 1.1s ease-in-out infinite}
  .repeat-btn{
    align-self:center;margin-bottom:clamp(2px,1vmin,10px);
    padding:clamp(8px,1.3vmin,16px) clamp(16px,2.6vmin,34px);
    border-radius:999px;background:#fff;font-weight:800;color:var(--ink-soft);
    font-size:clamp(12px,1.8vmin,22px);box-shadow:0 4px 0 rgba(27,33,64,.1);
  }
  .repeat-btn:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(27,33,64,.1)}

  @media (max-width:820px){
    .play-body{flex-direction:column}
    .options{max-width:100%;width:100%}
    .quiz-letter{font-size:clamp(80px,20vmin,200px)}
    .learn-stage{gap:8px}
  }
  @media (max-height:520px){
    .hero p{display:none}
    .grid-label{display:none}
    .brand{font-size:16px}
  }
  @media (prefers-reduced-motion:reduce){
    *{animation-duration:.01ms!important;transition-duration:.01ms!important}
  }

  /* toast */
  #toast{
    position:fixed;left:50%;top:clamp(10px,2vmin,24px);transform:translate(-50%,-150%);
    background:#1b2140;color:#fff;font-weight:800;font-size:clamp(13px,1.8vmin,22px);
    padding:.6em 1.2em;border-radius:999px;z-index:90;
    transition:transform .3s cubic-bezier(.2,1.4,.4,1), opacity .2s ease, visibility .2s;
    box-shadow:0 12px 30px rgba(27,33,64,.3);pointer-events:none;white-space:nowrap;
    opacity:0;visibility:hidden;
  }
  #toast.show{transform:translate(-50%,0);opacity:1;visibility:visible}

  /* TV remote / keyboard focus ring */
  .nav-focus{outline:6px solid #f59e0b;outline-offset:4px;position:relative;z-index:5}
</style>
</head>
<body>

<canvas id="fx"></canvas>

<!-- ============ HOME ============ -->
<section id="home" class="screen active">
  <div class="topbar">
    <div class="brand"><span class="dot"></span>ABC Adventure</div>
    <div class="top-actions">
      <div class="stars-pill" title="Stars earned">⭐ <span id="starCount">0</span></div>
      <button class="icon-btn" id="soundBtn" aria-label="Toggle sound" title="Sound on/off">🔊</button>
      <button class="icon-btn" id="fsBtn" aria-label="Fullscreen" title="Fullscreen">⛶</button>
    </div>
  </div>

  <div class="hero">
    <h1>A B C Adventure</h1>
    <p>Tap a letter to learn its words</p>
  </div>

  <div class="modes">
    <button class="mode mode--quiz" data-start="quiz">
      <span class="m-emoji">🎯</span>
      <span class="m-txt"><b>Word Match</b><small>Which word starts with the letter?</small></span>
    </button>
    <button class="mode mode--hunt" data-start="hunt">
      <span class="m-emoji">🔎</span>
      <span class="m-txt"><b>Letter Hunt</b><small>Hear a word, find its letter</small></span>
    </button>
    <button class="mode mode--random" data-start="random">
      <span class="m-emoji">🎲</span>
      <span class="m-txt"><b>Surprise Me</b><small>A random letter adventure</small></span>
    </button>
  </div>

  <div class="grid-wrap">
    <div class="grid-label">Tap a letter to meet its words</div>
    <div id="letterGrid" class="letter-grid"></div>
  </div>
  <div class="tip">Tip: press <b>F</b> for fullscreen &middot; words auto-advance every 5s &middot; press <b>P</b> to pause</div>
</section>

<!-- ============ LEARN ============ -->
<section id="learn" class="screen">
  <div class="learn-top">
    <button class="back-btn" id="learnBack" aria-label="Back home">←</button>
    <div class="learn-title" id="learnTitle">Letter A</div>
    <button class="auto-btn on" id="autoBtn" aria-label="Toggle 5-second auto timer">
      <span class="auto-dot"></span>
      <span id="autoText">5s Auto</span>
    </button>
  </div>
  <div class="timer-bar-wrap show" id="timerBarWrap">
    <div class="timer-bar running" id="timerBar"></div>
  </div>
  <div class="learn-stage" id="learnStage">
    <div class="big-letter" id="bigLetter">A</div>
    <div class="word-side">
      <div class="word-emoji" id="wordEmoji">🍎</div>
      <div class="word-text" id="wordText">Apple</div>
    </div>
  </div>
  <div class="word-note" id="wordNote"></div>
  <div class="word-rail" id="wordRail"><div class="rail-inner" id="railInner"></div></div>
  <div class="learn-controls">

/* ---------- helpers ---------- */
const $  = (s, r=document) => r.querySelector(s);
const $$ = (s, r=document) => [...r.querySelectorAll(s)];
const rand = arr => arr[Math.floor(Math.random()*arr.length)];
const shuffle = arr => {
  const a = arr.slice();
  for (let i=a.length-1;i>0;i--){ const j = Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; }
  return a;
};
const clamp = (n,a,b)=>Math.max(a,Math.min(b,n));

/* ---------- persistence ---------- */
const store = {
  get(k, fallback){
    try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : fallback; }
    catch(e){ return fallback; }
  },
  set(k, v){ try { localStorage.setItem(k, JSON.stringify(v)); } catch(e){} }
};

const state = {
  screen: 'home',
  sound: store.get('abc.sound', true),
  stars: store.get('abc.stars', {}),
  learn: { li:0, wi:0, auto: store.get('abc.auto', true) },
  quiz: { letter:null, word:null, locked:false, attempts:0 },
  hunt: { letter:null, word:null, locked:false, attempts:0 },
  timer: null,
  learnTimer: null,
  lastQuizLetter: null,
  lastHuntLetter: null
};

/* TV-remote / keyboard focus tracking */
const NAV = { el: null };

/* ---------- sound (Web Audio, no files) ---------- */
let actx = null;
function audio(){
  if (!actx){
    const C = window.AudioContext || window.webkitAudioContext;
    if (C) actx = new C();
  }
  if (actx && actx.state === 'suspended') actx.resume();
  return actx;
}
function beep(freq, dur, { type='sine', vol=0.16, delay=0, slideTo=null } = {}){
  if (!state.sound) return;
  const ac = audio(); if (!ac) return;
  const t0 = ac.currentTime + delay;
  const o = ac.createOscillator(), g = ac.createGain();
  o.type = type;
  o.frequency.setValueAtTime(freq, t0);
  if (slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, t0 + dur);
  g.gain.setValueAtTime(0.0001, t0);
  g.gain.linearRampToValueAtTime(vol, t0 + 0.015);
  g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
  o.connect(g); g.connect(ac.destination);
  o.start(t0); o.stop(t0 + dur + 0.06);
}
const sfx = {
  tap(){ beep(660, .06, { type:'triangle', vol:.09 }); },
  next(){ beep(520, .08, { vol:.08 }); },
  correct(){
    [523.25, 659.25, 783.99, 1046.5].forEach((f,i)=>beep(f, .24, { delay:i*.085, vol:.15 }));
  },
  wrong(){ beep(300, .2, { vol:.11, slideTo:190 }); },
  star(){ [880, 1174.66, 1567.98].forEach((f,i)=>beep(f, .18, { delay:i*.07, vol:.11 })); }
};

/* ---------- speech ---------- */
let voice = null;
function pickVoice(){
  if (!('speechSynthesis' in window)) return;
  const vs = speechSynthesis.getVoices();
  voice =
    vs.find(v => /en[-_]US/i.test(v.lang) && /female|samantha|zira|aria|jenny|eva/i.test(v.name)) ||
    vs.find(v => /en[-_]GB/i.test(v.lang) && /female|hazel|susan|libby/i.test(v.name)) ||
    vs.find(v => /^en/i.test(v.lang)) || null;
}
if ('speechSynthesis' in window){
  pickVoice();
  speechSynthesis.onvoiceschanged = pickVoice;
}
let speakToken = 0;
function speak(text, { rate = .85, pitch = 1.12 } = {}){
  if (!state.sound || !('speechSynthesis' in window)) return;
  const token = ++speakToken;
  try {
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.rate = rate; u.pitch = pitch; u.volume = 1;
    if (voice) u.voice = voice;
    // slight delay avoids Chrome dropping an utterance right after cancel()
    setTimeout(() => {
      if (token !== speakToken) return;
      try { speechSynthesis.speak(u); } catch(e){}
    }, 35);
  } catch(e){}
}
function stopSpeech(){
  speakToken++;
  try { if ('speechSynthesis' in window) speechSynthesis.cancel(); } catch(e){}
}

/* ---------- stars ---------- */
function totalStars(){ return Object.values(state.stars).reduce((a,b)=>a+b,0); }
function addStar(letter){
  state.stars[letter] = (state.stars[letter] || 0) + 1;
  store.set('abc.stars', state.stars);
  updateStarUI();
  const t = totalStars();
  if (t > 0 && t % 10 === 0){
    sfx.star();
    toast(`🎉 ${t} stars! Amazing!`);
    burst(window.innerWidth/2, window.innerHeight*0.35, 140);
  }
}
function updateStarUI(){
  $('#starCount').textContent = totalStars();
  $$('.tile').forEach(tile => {
    const L = LETTERS[+tile.dataset.i];
    const n = state.stars[L.l] || 0;
    const badge = tile.querySelector('.badge');
    if (n > 0){
      if (badge){ badge.innerHTML = `<span class="s">⭐</span>${n}`; }
      else tile.insertAdjacentHTML('beforeend', `<span class="badge"><span class="s">⭐</span>${n}</span>`);
    } else if (badge){
      badge.remove();
    }
  });
}

/* ---------- TV remote / keyboard navigation ---------- */
function clearNav(){
  if (NAV.el){ NAV.el.classList.remove('nav-focus'); NAV.el = null; }
}
function setNav(el){
  if (!el || NAV.el === el) return;
  clearNav();
  NAV.el = el;
  el.classList.add('nav-focus');
  try { el.scrollIntoView({ block:'nearest', inline:'nearest' }); } catch(e){}
}
function navItems(){
  const scr = $('.screen.active');
  if (!scr) return [];
  return $$('button', scr).filter(el => el.offsetParent !== null);
}
function moveNav(dir){
  const items = navItems();
  if (!items.length) return;
  if (!NAV.el || !items.includes(NAV.el)){ setNav(items[0]); return; }
  const cr = NAV.el.getBoundingClientRect();
  const cx = cr.left + cr.width/2, cy = cr.top + cr.height/2;
  let best = null, bestScore = Infinity;
  for (const el of items){
    if (el === NAV.el) continue;
    const r = el.getBoundingClientRect();
    const dx = (r.left + r.width/2) - cx;
    const dy = (r.top + r.height/2) - cy;
    let primary, secondary;
    if (dir === 'left'){ if (dx >= -2) continue; primary = -dx; secondary = Math.abs(dy); }
    else if (dir === 'right'){ if (dx <= 2) continue; primary = dx; secondary = Math.abs(dy); }
    else if (dir === 'up'){ if (dy >= -2) continue; primary = -dy; secondary = Math.abs(dx); }
    else { if (dy <= 2) continue; primary = dy; secondary = Math.abs(dx); }
    const score = primary + secondary * 2;
    if (score < bestScore){ bestScore = score; best = el; }
  }
  if (best) setNav(best);
}
function keyName(e){
  const k = e.key;
  if (k && k !== 'Unidentified' && k !== 'Dead') return k;
  return ({
    37:'ArrowLeft', 38:'ArrowUp', 39:'ArrowRight', 40:'ArrowDown',
    13:'Enter', 32:' ', 8:'Backspace', 27:'Escape',
    166:'Back', 461:'Back', 10009:'Back'
  })[e.keyCode] || '';
}

/* ---------- screens ---------- */
function show(name){
  state.screen = name;
  $$('.screen').forEach(s => s.classList.toggle('active', s.id === name));
  clearNav();
  if (name === 'home'){
    const first = $('.tile');
    if (first) setNav(first);
  }
  if (name !== 'quiz' && name !== 'hunt') clearTimer();
  if (name !== 'learn') stopAutoTimer();
}
function goHome(){
  clearTimer();
  stopAutoTimer();
  stopSpeech();
  show('home');
  updateStarUI();
}
function clearTimer(){
  if (state.timer){ clearTimeout(state.timer); state.timer = null; }
}

function updateAutoUI(){
  const btn = $('#autoBtn');
  const txt = $('#autoText');
  const wrap = $('#timerBarWrap');
  if (!btn) return;
  const on = !!state.learn.auto;
  btn.classList.toggle('on', on);
  btn.setAttribute('aria-label', on ? 'Pause 5-second auto timer' : 'Start 5-second auto timer');
  btn.setAttribute('title', on ? 'Auto-advance is ON (5s) · Click to pause' : 'Auto-advance is Paused · Click to play');
  if (txt) txt.textContent = on ? '5s Auto' : 'Paused';
  if (wrap) wrap.classList.toggle('show', on && state.screen === 'learn');
}

function stopAutoTimer(){
  if (state.learnTimer){
    clearTimeout(state.learnTimer);
    state.learnTimer = null;
  }
  const bar = $('#timerBar');
  if (bar){
    bar.classList.remove('running');
  }
  const wrap = $('#timerBarWrap');
  if (wrap) wrap.classList.remove('show');
}

function resetAutoTimer(){
  stopAutoTimer();
  updateAutoUI();
  if (!state.learn.auto || state.screen !== 'learn') return;

  const wrap = $('#timerBarWrap');
  if (wrap) wrap.classList.add('show');

  const bar = $('#timerBar');
  if (bar){
    void bar.offsetWidth; // reflow to restart CSS 5s keyframe animation
    bar.classList.add('running');
  }

  state.learnTimer = setTimeout(() => {
    if (state.screen === 'learn' && state.learn.auto){
      stepWord(1);
    }
  }, 5000);
}

function toggleAutoPlay(){
  audio();
  sfx.tap();
  state.learn.auto = !state.learn.auto;
  store.set('abc.auto', state.learn.auto);
  if (state.learn.auto){
    resetAutoTimer();
    toast('⏱️ Auto 5s: ON');
  } else {
    stopAutoTimer();
    updateAutoUI();
    toast('⏸️ Auto 5s: Paused');
  }
}

/* ---------- home ---------- */
function renderHome(){
  const grid = $('#letterGrid');
  grid.innerHTML = LETTERS.map((L,i)=>`
    <button class="tile" data-i="${i}" style="--h:${L.hue}" aria-label="Letter ${L.l}">
      ${L.l}
    </button>
  `).join('');
  updateStarUI();
  $('#soundBtn').textContent = state.sound ? '🔊' : '🔇';
}

/* ---------- learn ---------- */
function openLearn(index){
  state.learn.li = clamp(index, 0, LETTERS.length-1);
  state.learn.wi = 0;
  show('learn');
  renderLearn(true);
}
function wordMarkup(word, letter){
  if (word[0].toUpperCase() === letter){
    return `<span class="hl">${word[0]}</span>${word.slice(1)}`;
  }
  // X words like "Box": highlight the X inside the word
  return word.replace(new RegExp(letter, 'ig'), m => `<span class="hl">${m}</span>`);
}
function renderLearn(announce){
  const L = LETTERS[state.learn.li];
  const [word, emoji] = L.words[state.learn.wi];
  const scr = $('#learn');
  scr.style.setProperty('--h', L.hue);
  $('#learnTitle').textContent = `Letter ${L.l} · ${state.learn.wi + 1}/${L.words.length}`;
  $('#bigLetter').textContent = L.l;
  $('#wordEmoji').textContent = emoji;
  $('#wordText').innerHTML = wordMarkup(word, L.l);

  const starts = word[0].toUpperCase() === L.l;
  const note = $('#wordNote');
  note.textContent = starts ? '' : `Listen for the ${L.l} sound inside this word`;
  note.style.visibility = starts ? 'hidden' : 'visible';

  // word strip: tap any picture to jump straight to it
  $('#railInner').innerHTML = L.words.map(([w,e],i)=>`
    <button class="rail-btn ${i === state.learn.wi ? 'on' : ''}" data-w="${i}"
            aria-label="${w}" title="${w}">${e}</button>
  `).join('');

  // restart pop animations
  const bl = $('#bigLetter'), ws = $('.word-side');
  [bl, ws].forEach(el => { el.style.animation = 'none'; void el.offsetWidth; el.style.animation = ''; });

  const active = $('#railInner .rail-btn.on');
  if (active) active.scrollIntoView({ inline:'center', block:'nearest', behavior:'smooth' });

  if (announce) speak(`${L.l} for ${word}`, { rate:.78 });
  resetAutoTimer();
}
function stepWord(dir){
  const L = LETTERS[state.learn.li];
  let wi = state.learn.wi + dir;
  let li = state.learn.li;
  if (wi < 0){ li = (li - 1 + LETTERS.length) % LETTERS.length; wi = LETTERS[li].words.length - 1; }
  else if (wi >= L.words.length){ li = (li + 1) % LETTERS.length; wi = 0; }
  state.learn.li = li; state.learn.wi = wi;
  sfx.next();
  renderLearn(true);
}
function stepLetter(dir){
  state.learn.li = (state.learn.li + dir + LETTERS.length) % LETTERS.length;
  state.learn.wi = 0;
  sfx.next();
  renderLearn(true);
}
function sayCurrentWord(){
  const L = LETTERS[state.learn.li];
  const [word] = L.words[state.learn.wi];
  speak(`${L.l} for ${word}`, { rate:.72 });
}

/* ---------- quiz ---------- */
function pickWeightedLetter(exclude){
  const pool = [];
  for (const L of LETTERS){
    if (L.l === exclude) continue;
    const n = state.stars[L.l] || 0;
    const weight = Math.max(1, 4 - n); // fewer stars -> more likely
    for (let k=0;k<weight;k++) pool.push(L);
  }
  return pool.length ? rand(pool) : rand(LETTERS);
}
function startQuiz(){
  stopSpeech();
  show('quiz');
  nextQuiz();
}
function nextQuiz(){
  clearTimer();
  const q = state.quiz;
  q.locked = false; q.attempts = 0;

  const L = pickWeightedLetter(state.lastQuizLetter);
  state.lastQuizLetter = L.l;
  q.letter = L.l;

  const [word, emoji] = rand(L.starters);
  q.word = word;

  // two distractors whose first letter differs from the answer
  const distractors = [];
  let guard = 0;
  while (distractors.length < 2 && guard++ < 200){
    const D = rand(LETTERS);
    if (D.l === L.l) continue;
    const dw = rand(D.words);
    if (dw[0][0].toUpperCase() === L.l) continue;
    if (distractors.some(d => d[0] === dw[0])) continue;
    distractors.push(dw);
  }

  const opts = shuffle([[word, emoji, true], ...distractors.map(d => [d[0], d[1], false])]);

  const scr = $('#quiz');
  scr.style.setProperty('--h', L.hue);
  $('#quizPrompt').innerHTML = `Which one starts with <b>${L.l}</b>?`;
  $('#quizLetter').textContent = L.l;
  const ql = $('#quizLetter');
  ql.style.animation = 'none'; void ql.offsetWidth; ql.style.animation = '';

  $('#quizOptions').innerHTML = opts.map(([w,e,ok],i)=>`
    <button class="opt" data-ok="${ok ? 1 : 0}" data-word="${w.replace(/"/g,'&quot;')}">
      <span class="emoji">${e}</span>
      <span class="label">${w}</span>
    </button>
  `).join('');

  speak(`Which one starts with ${L.l}?`, { rate:.8 });
  setNav($('#quizOptions .opt'));
}
function answerQuiz(btn){
  const q = state.quiz;
  if (q.locked) return;

  if (btn.dataset.ok === '1'){
    q.locked = true;
    btn.classList.add('correct');
    $$('#quizOptions .opt').forEach(o => { if (o !== btn) o.classList.add('dim'); });
    addStar(q.letter);
    sfx.correct();
    burstEl(btn, 90);
    speak(`${q.letter} for ${q.word}`, { rate:.78 });
    state.timer = setTimeout(nextQuiz, 2100);
  } else {
    q.attempts++;
    sfx.wrong();
    btn.classList.remove('wrong'); void btn.offsetWidth; btn.classList.add('wrong');
    setTimeout(()=>btn.classList.remove('wrong'), 450);
    speak('Try again', { rate:.85, pitch:1.2 });
    if (q.attempts >= 2){
      const good = $('#quizOptions .opt[data-ok="1"]');
      if (good) good.classList.add('hint');
    }
  }
}

/* ---------- hunt ---------- */
function startHunt(){
  stopSpeech();
  show('hunt');
  nextHunt();
}
function nextHunt(){
  clearTimer();
  const h = state.hunt;
  h.locked = false; h.attempts = 0;

  const L = pickWeightedLetter(state.lastHuntLetter);
  state.lastHuntLetter = L.l;
  h.letter = L.l;

  const [word, emoji] = rand(L.starters);
  h.word = word;

  const others = shuffle(LETTERS.filter(x => x.l !== L.l)).slice(0,2).map(x=>x.l);
  const opts = shuffle([L.l, ...others]);

  const scr = $('#hunt');
  scr.style.setProperty('--h', L.hue);
  $('#huntEmoji').textContent = emoji;
  $('#huntWord').textContent = word;
  $('#huntPrompt').innerHTML = `Which letter does this word start with?`;
  $('#huntOptions').innerHTML = opts.map(l => `
    <button class="letter-opt" data-l="${l}">${l}</button>
  `).join('');

  speak(`${word}. Which letter does ${word} start with?`, { rate:.8 });
  setNav($('#huntOptions .letter-opt'));
}
function answerHunt(btn){
  const h = state.hunt;
  if (h.locked) return;

  if (btn.dataset.l === h.letter){
    h.locked = true;
    btn.classList.add('correct');
    addStar(h.letter);
    sfx.correct();
    burstEl(btn, 90);
    speak(`${h.letter} for ${h.word}`, { rate:.78 });
    state.timer = setTimeout(nextHunt, 2100);
  } else {
    h.attempts++;
    sfx.wrong();
    btn.classList.remove('wrong'); void btn.offsetWidth; btn.classList.add('wrong');
    setTimeout(()=>btn.classList.remove('wrong'), 450);
    speak('Try again', { rate:.85, pitch:1.2 });
    if (h.attempts >= 2){
      const good = $(`#huntOptions .letter-opt[data-l="${h.letter}"]`);
      if (good) good.classList.add('hint');
    }
  }
}

/* ---------- confetti ---------- */
const canvas = $('#fx');
const ctx = canvas.getContext('2d');
let parts = [], rafId = null;
const COLORS = ['#ff5d8f','#ffb703','#2ec4b6','#4d7cff','#9b5de5','#f15bb5','#00bbf9','#ffd166'];

function resizeCanvas(){
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  canvas.width = Math.floor(window.innerWidth * dpr);
  canvas.height = Math.floor(window.innerHeight * dpr);
  ctx.setTransform(dpr,0,0,dpr,0,0);
}
resizeCanvas();
addEventListener('resize', resizeCanvas);

function burst(x, y, count = 90){
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  if (reduce) return;
  for (let i=0;i<count;i++){
    const a = Math.random() * Math.PI * 2;
    const sp = 3 + Math.random() * 11;
    parts.push({
      x, y,
      vx: Math.cos(a) * sp,
      vy: Math.sin(a) * sp - 5,
      w: 5 + Math.random() * 9,
      h: 8 + Math.random() * 12,
      rot: Math.random() * Math.PI,
      vr: (Math.random() - .5) * .3,
      color: COLORS[(Math.random()*COLORS.length)|0],
      life: 1,
      decay: .008 + Math.random() * .008
    });
  }
  if (!rafId) rafId = requestAnimationFrame(tick);
}
function burstEl(el, count = 90){
  const r = el.getBoundingClientRect();
  burst(r.left + r.width/2, r.top + r.height/2, count);
}
function tick(){
  ctx.clearRect(0, 0, window.innerWidth, window.innerHeight);
  for (let i = parts.length - 1; i >= 0; i--){
    const p = parts[i];
    p.vy += 0.35;
    p.vx *= 0.992;
    p.vy *= 0.992;
    p.x += p.vx;
    p.y += p.vy;
    p.rot += p.vr;
    p.life -= p.decay;
    if (p.life <= 0 || p.y > window.innerHeight + 60){ parts.splice(i,1); continue; }
    ctx.save();
    ctx.globalAlpha = Math.max(0, Math.min(1, p.life));
    ctx.translate(p.x, p.y);
    ctx.rotate(p.rot);
    ctx.fillStyle = p.color;
    ctx.fillRect(-p.w/2, -p.h/2, p.w, p.h);
    ctx.restore();
  }
  if (parts.length) rafId = requestAnimationFrame(tick);
  else { rafId = null; ctx.clearRect(0, 0, window.innerWidth, window.innerHeight); }
}

/* ---------- toast ---------- */
let toastTimer = null;
function toast(msg){
  const t = $('#toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>t.classList.remove('show'), 2200);
}

/* ---------- events ---------- */
$('#letterGrid').addEventListener('click', e => {
  const tile = e.target.closest('.tile');
  if (!tile) return;
  audio(); sfx.tap();
  openLearn(+tile.dataset.i);
});

$('#learnBack').addEventListener('click', () => { sfx.tap(); goHome(); });
$('#autoBtn').addEventListener('click', toggleAutoPlay);
$('#prevWord').addEventListener('click', () => { audio(); stepWord(-1); });
$('#nextWord').addEventListener('click', () => { audio(); stepWord(1); });
$('#sayBtn').addEventListener('click', () => { audio(); sayCurrentWord(); resetAutoTimer(); });
$('#bigLetter').addEventListener('click', () => { audio(); sayCurrentWord(); resetAutoTimer(); });
$('#wordEmoji').addEventListener('click', () => { audio(); sayCurrentWord(); resetAutoTimer(); });
$('#railInner').addEventListener('click', e => {
  const b = e.target.closest('.rail-btn');
  if (!b) return;
  audio(); sfx.tap();
  state.learn.wi = +b.dataset.w;
  renderLearn(true);
});

$$('[data-start]').forEach(btn => {
  btn.addEventListener('click', () => {
    audio(); sfx.tap();
    const mode = btn.dataset.start;
    if (mode === 'quiz') startQuiz();
    else if (mode === 'hunt') startHunt();
    else { // random letter
      const i = Math.floor(Math.random() * LETTERS.length);
      openLearn(i);
    }
  });
});

$('#quizOptions').addEventListener('click', e => {
  const btn = e.target.closest('.opt');
  if (!btn) return;
  audio();
  if (!state.quiz.locked) sfx.tap();
  answerQuiz(btn);
});
$('#huntOptions').addEventListener('click', e => {
  const btn = e.target.closest('.letter-opt');
  if (!btn) return;
  audio();
  if (!state.hunt.locked) sfx.tap();
  answerHunt(btn);
});
$('#quizRepeat').addEventListener('click', () => {
  audio();
  const L = state.quiz.letter;
  if (L) speak(`Which one starts with ${L}?`, { rate:.8 });
});
$('#huntRepeat').addEventListener('click', () => {
  audio();
  const w = state.hunt.word;
  if (w) speak(`${w}. Which letter does ${w} start with?`, { rate:.8 });
});

$$('[data-home]').forEach(b => b.addEventListener('click', () => { sfx.tap(); goHome(); }));

$('#soundBtn').addEventListener('click', () => {
  state.sound = !state.sound;
  store.set('abc.sound', state.sound);
  $('#soundBtn').textContent = state.sound ? '🔊' : '🔇';
  if (!state.sound) stopSpeech();
  else { audio(); sfx.tap(); }
  toast(state.sound ? '🔊 Sound on' : '🔇 Sound off');
});

$('#fsBtn').addEventListener('click', () => {
  const d = document;
  try {
    if (!d.fullscreenElement){
      const req = d.documentElement.requestFullscreen;
      if (req) req.call(d.documentElement).catch(() => {});
    } else if (d.exitFullscreen){
      d.exitFullscreen().catch(() => {});
    }
  } catch(e){}
});

/* swipe on learn stage */
let swipeX = null;
const stage = $('#learnStage');
stage.addEventListener('touchstart', e => { swipeX = e.touches[0].clientX; }, { passive:true });
stage.addEventListener('touchend', e => {
  if (swipeX == null) return;
  const dx = e.changedTouches[0].clientX - swipeX;
  if (Math.abs(dx) > 55){ audio(); stepWord(dx < 0 ? 1 : -1); }
  swipeX = null;
}, { passive:true });

/* keyboard + TV remote (D-pad) */
addEventListener('keydown', e => {
  if (e.repeat) return;
  const k = keyName(e);

  // Back / Escape -> letter grid
  if (k === 'Escape' || k === 'Backspace' || k === 'Back' ||
      k === 'BrowserBack' || k === 'GoBack'){
    e.preventDefault(); goHome(); return;
  }
  if (k === 'f' || k === 'F'){ $('#fsBtn').click(); return; }

  if (state.screen === 'home'){
    // typing a letter still works with a keyboard
    if (k.length === 1 && /^[a-zA-Z]$/.test(k)){
      const i = LETTERS.findIndex(L => L.l === k.toUpperCase());
      if (i >= 0){ audio(); openLearn(i); }
      return;
    }
    if (k === 'ArrowLeft' || k === 'ArrowRight' || k === 'ArrowUp' || k === 'ArrowDown'){
      e.preventDefault(); audio();
      moveNav(k.replace('Arrow','').toLowerCase());
      return;
    }
    if (k === 'Enter' || k === ' '){
      e.preventDefault();
      if (!NAV.el){ setNav($('.tile')); return; }
      audio(); NAV.el.click();
      return;
    }
    return;
  }

  if (state.screen === 'learn'){
    if (k === 'ArrowRight'){ e.preventDefault(); audio(); stepWord(1); }
    else if (k === 'ArrowLeft'){ e.preventDefault(); audio(); stepWord(-1); }
    else if (k === 'ArrowDown'){ e.preventDefault(); audio(); stepLetter(1); }
    else if (k === 'ArrowUp'){ e.preventDefault(); audio(); stepLetter(-1); }
    else if (k === ' ' || k === 'Enter'){ e.preventDefault(); audio(); sayCurrentWord(); resetAutoTimer(); }
    else if (k === 'p' || k === 'P' || k === 'a' || k === 'A'){ e.preventDefault(); toggleAutoPlay(); }
    return;
  }

  if (state.screen === 'quiz'){
    if (k === 'ArrowLeft' || k === 'ArrowRight' || k === 'ArrowUp' || k === 'ArrowDown'){
      e.preventDefault(); audio();
      if (!NAV.el) setNav($('#quizOptions .opt'));
      moveNav(k.replace('Arrow','').toLowerCase());
      return;
    }
    if (k === 'Enter'){
      e.preventDefault();
      if (!NAV.el){ setNav($('#quizOptions .opt')); return; }
      audio(); NAV.el.click();
      return;
    }
    if (k === ' '){ e.preventDefault(); $('#quizRepeat').click(); return; }
    if (['1','2','3'].includes(k)){
      const btn = $$('#quizOptions .opt')[+k - 1];
      if (btn){ audio(); answerQuiz(btn); }
    }
    return;
  }

  if (state.screen === 'hunt'){
    if (k === 'ArrowLeft' || k === 'ArrowRight' || k === 'ArrowUp' || k === 'ArrowDown'){
      e.preventDefault(); audio();
      if (!NAV.el) setNav($('#huntOptions .letter-opt'));
      moveNav(k.replace('Arrow','').toLowerCase());
      return;
    }
    if (k === 'Enter'){
      e.preventDefault();
      if (!NAV.el){ setNav($('#huntOptions .letter-opt')); return; }
      audio(); NAV.el.click();
      return;
    }
    if (k === ' '){ e.preventDefault(); $('#huntRepeat').click(); return; }
    if (['1','2','3'].includes(k)){
      const btn = $$('#huntOptions .letter-opt')[+k - 1];
      if (btn){ audio(); answerHunt(btn); }
    }
  }
});

// a mouse/touch tap drops the TV focus ring
addEventListener('pointerdown', () => clearNav(), { passive:true });

/* unlock audio on first interaction (mobile / some browsers) */
addEventListener('pointerdown', () => audio(), { once:true });

/* pause auto timer when tab is hidden, resume when visible */
document.addEventListener('visibilitychange', () => {
  if (document.hidden){
    stopAutoTimer();
  } else if (state.screen === 'learn' && state.learn.auto){
    resetAutoTimer();
  }
});

/* ---------- boot ---------- */
renderHome();
setNav($('.tile'));
</script>
